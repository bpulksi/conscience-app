name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/conscience-app-progress-dymqf
      - integrate/android-app
      - feature/block-loop
      - avatar-layer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production – bpulksi-conscience-app
    permissions:
      contents: write

    env:
      FLUTTER_VERSION: 3.29.0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        run: |
          set -euo pipefail
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o /tmp/flutter.tar.xz
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --no-analytics

      - name: Write local.properties
        run: |
          cat > flutter/android/local.properties <<EOF
          flutter.sdk=$HOME/flutter
          sdk.dir=$ANDROID_HOME
          flutter.versionName=0.1.0
          flutter.versionCode=${{ github.run_number }}
          EOF

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Not -e: a failed decode must reach the validity check below.
          set +e
          target=flutter/android/app/keystore.jks
          secret="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          # Check for hex first: hex text is also valid base64, and decodes to garbage.
          if printf '%s' "$secret" | grep -Eq '^[0-9a-fA-F]+$'; then
            format=hex
            printf '%s' "$secret" | python3 -c 'import binascii,sys; sys.stdout.buffer.write(binascii.unhexlify(sys.stdin.read()))' > "$target"
          else
            format=base64
            printf '%s' "$secret" | base64 -d > "$target" 2>/dev/null
          fi
          details="format=$format size=$(wc -c < "$target") starts_with=$(od -An -tx1 -N4 "$target" | tr -d ' ')"
          if keytool -list -keystore "$target" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "Keystore is valid ($details)"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error title=Keystore::Keystore secrets are invalid, so main can't be release-signed ($details)"
            exit 1
          else
            rm -f "$target"
            echo "::warning title=Keystore::Keystore secrets are invalid, so this APK is debug-signed ($details)"
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > flutter/android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > flutter/android/app/google-services.json
          fi
          head -c1 flutter/android/app/google-services.json | grep -q '{' || {
            echo "::error::google-services.json is not valid JSON"
            exit 1
          }

      - name: Generate Firebase settings
        run: node .github/scripts/write-firebase-options.js flutter/android/app/google-services.json flutter/lib/firebase_options.dart

      - name: Get Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Analyze Dart code
        run: |
          cd flutter
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary="$(grep -E '^ *error ' analyze.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=flutter analyze::$summary"
          fi
          exit "$code"

      - name: Build APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd flutter
          set +e
          flutter build apk --release \
            --build-name=0.1.0 \
            --build-number=${{ github.run_number }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Annotations can be read without opening the full log.
            summary="$(grep -E -A6 '^e: |error:|Error:|What went wrong|Execution failed|Could not ' build.log | grep -vE '^(--|\s*$)' | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=flutter build::$summary"
          fi
          exit "$code"

      - name: Upload APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: app-release
          path: flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Run Android unit tests
        run: |
          cd flutter/android
          set +e
          ./gradlew :app:testReleaseUnitTest --console=plain 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary="$(grep -E -A3 'FAILED|What went wrong|^e: ' test.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Android unit tests::$summary"
          fi
          exit "$code"

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0-build-${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          **Conscience Android APK - Build ${RUN_NUMBER}**

          Built from commit: ${SHA}

          ### Installation
          1. Download \`app-release.apk\`
          2. Transfer to Android device or use \`adb install app-release.apk\`
          3. Grant permissions when prompted

          ### Testing
          - Onboarding: Grant Accessibility Service permission
          - Home: Configure daily limit and monitor apps
          - Recharge: Complete wellness sessions to earn coins

          [View commit](https://github.com/${REPO}/commit/${SHA})
          EOF
          gh release create "$TAG" \
            flutter/build/app/outputs/flutter-apk/app-release.apk \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
