name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/conscience-app-progress-dymqf
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production – bpulksi-conscience-app

    steps:
      - uses: actions/checkout@e2f20aa261021e5a93ff3b1405afb1e22aadc7ee  # v4

      - name: Set up Java
        uses: actions/setup-java@99b8673ff64fbf33d533d7d1915dce4fd614aef1  # v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b12debe3b76c5f68d7879891b3cfe58f9  # v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Get Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Build APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd flutter
          flutter build apk --release \
            --build-name=0.1.0 \
            --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@c7d193f32eddeabc2f90a21e3386495c3a96d0cb  # v4
        with:
          name: app-release
          path: flutter/build/app/outputs/flutter-app.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@de2c0eb89ae2a2524e593c34293f78a9c1479fbf  # v1
        with:
          files: flutter/build/app/outputs/flutter-app.apk
          tag_name: v0.1.0-build-${{ github.run_number }}
          body: |
            **Conscience Android APK - Build ${{ github.run_number }}**

            Built from commit: ${{ github.sha }}

            ### Installation
            1. Download `flutter-app.apk`
            2. Transfer to Android device or use `adb install flutter-app.apk`
            3. Grant permissions when prompted

            ### Testing
            - Onboarding: Grant Accessibility Service permission
            - Home: Configure daily limit and monitor apps
            - Recharge: Complete wellness sessions to earn coins

            [View commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
