name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/conscience-app-progress-dymqf
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production – bpulksi-conscience-app
    permissions:
      contents: write

    env:
      FLUTTER_VERSION: 3.29.0

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        run: |
          set -euo pipefail
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o /tmp/flutter.tar.xz
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --no-analytics

      - name: Write local.properties
        run: |
          cat > flutter/android/local.properties <<EOF
          flutter.sdk=$HOME/flutter
          sdk.dir=$ANDROID_HOME
          flutter.versionName=0.1.0
          flutter.versionCode=${{ github.run_number }}
          EOF

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter/android/app/keystore.jks 2>/dev/null; then
            echo "Keystore decoded from base64"
          else
            printf '%s' "$KEYSTORE_BASE64" | xxd -r -p > flutter/android/app/keystore.jks || {
              echo "::error::Failed to decode KEYSTORE_BASE64"
              exit 1
            }
          fi
          ls -lh flutter/android/app/keystore.jks

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > flutter/android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > flutter/android/app/google-services.json
          fi
          head -c1 flutter/android/app/google-services.json | grep -q '{' || {
            echo "::error::google-services.json is not valid JSON"
            exit 1
          }

      - name: Get Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Build APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd flutter
          flutter build apk --release \
            --build-name=0.1.0 \
            --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: app-release
          path: flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0-build-${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          **Conscience Android APK - Build ${RUN_NUMBER}**

          Built from commit: ${SHA}

          ### Installation
          1. Download \`app-release.apk\`
          2. Transfer to Android device or use \`adb install app-release.apk\`
          3. Grant permissions when prompted

          ### Testing
          - Onboarding: Grant Accessibility Service permission
          - Home: Configure daily limit and monitor apps
          - Recharge: Complete wellness sessions to earn coins

          [View commit](https://github.com/${REPO}/commit/${SHA})
          EOF
          gh release create "$TAG" \
            flutter/build/app/outputs/flutter-apk/app-release.apk \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
