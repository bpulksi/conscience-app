name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/conscience-app-progress-dymqf
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production – bpulksi-conscience-app
    permissions:
      contents: write

    env:
      FLUTTER_VERSION: 3.19.0

    steps:
      - uses: actions/checkout@e2f20aa261021e5a93ff3b1405afb1e22aadc7ee  # v4

      - name: Set up Java
        uses: actions/setup-java@99b8673ff64fbf33d533d7d1915dce4fd614aef1  # v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        run: |
          set -euo pipefail
          FLUTTER_DIR="$HOME/flutter"
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o /tmp/flutter.tar.xz
          mkdir -p "$FLUTTER_DIR"
          tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --no-analytics

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Get Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Build APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd flutter
          flutter build apk --release \
            --build-name=0.1.0 \
            --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@c7d193f32eddeabc2f90a21e3386495c3a96d0cb  # v4
        with:
          name: app-release
          path: flutter/build/app/outputs/flutter-app.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0-build-${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          **Conscience Android APK - Build ${RUN_NUMBER}**

          Built from commit: ${SHA}

          ### Installation
          1. Download \`flutter-app.apk\`
          2. Transfer to Android device or use \`adb install flutter-app.apk\`
          3. Grant permissions when prompted

          ### Testing
          - Onboarding: Grant Accessibility Service permission
          - Home: Configure daily limit and monitor apps
          - Recharge: Complete wellness sessions to earn coins

          [View commit](https://github.com/${REPO}/commit/${SHA})
          EOF
          gh release create "$TAG" \
            flutter/build/app/outputs/flutter-app.apk \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
