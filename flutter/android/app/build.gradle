plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.conscience.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.conscience.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

// Force shrinkResources off across all build types AFTER Flutter plugin evaluates.
// Flutter's gradle plugin enables shrinkResources=true in release builds and runs
// after the DSL, overriding any setting above. This afterEvaluate block runs last.
afterEvaluate {
    android.buildTypes.all { bt ->
        bt.minifyEnabled = false
        bt.shrinkResources = false
    }
}

dependencies {
    // Firebase
    implementation platform("com.google.firebase:firebase-bom:32.7.4")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-functions-ktx"

    // Lottie
    implementation "com.airbnb.android:lottie:6.3.0"

    // Android core
    implementation "androidx.core:core-ktx:1.12.0"
}

flutter {
    source '../..'
}
